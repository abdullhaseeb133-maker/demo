<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call Now</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#24466e,#101c35 55%,#060b17);font-family:Arial,sans-serif;color:white}.wrap{position:relative;display:grid;place-items:center;width:280px;height:280px}.ring{position:absolute;width:166px;height:166px;border:2px solid #38e8ae;border-radius:50%;animation:pulse 3s infinite;pointer-events:none}.ring:nth-child(2){animation-delay:1s}.ring:nth-child(3){animation-delay:2s}button{z-index:1;width:166px;height:166px;border:0;border-radius:50%;background:linear-gradient(145deg,#36e8a0,#008e60);color:white;box-shadow:0 0 45px #10d68b65,inset 0 1px 2px #ffffff88;font-size:21px;font-weight:900;cursor:pointer;display:grid;place-content:center;gap:12px;justify-items:center}button.active{background:#c62b45}button:disabled{opacity:.7}button:focus-visible{outline:3px solid white;outline-offset:6px}#status{position:absolute;top:100%;text-align:center;width:100%;font-size:14px} @keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.65);opacity:0}}@media(prefers-reduced-motion:reduce){.ring{animation:none;opacity:.2}}</style></head><body><main class="wrap"><div class="ring"></div><div class="ring"></div><div class="ring"></div><button id="call"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3 5.2 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.7l.6 2.8a2 2 0 0 1-.6 2L8.7 11a16 16 0 0 0 4.3 4.3l1.5-1.3a2 2 0 0 1 2-.6l2.8.6a2 2 0 0 1 2 2Z"/></svg><span>CALL NOW</span></button><div id="status" role="status"></div></main><script type="module">
import {Room,RoomEvent,Track} from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';
const b=document.querySelector('#call'), label=b.querySelector('span'), status=document.querySelector('#status');let room;
function reset(){room=undefined;b.classList.remove('active');label.textContent='CALL NOW';b.disabled=false;document.querySelectorAll('audio').forEach(a=>a.remove())}
b.onclick=async()=>{if(room){await room.disconnect();reset();return}b.disabled=true;status.textContent='';label.textContent='CONNECTING';try{const res=await fetch('/.netlify/functions/token',{method:'POST'});if(!res.ok)throw Error('Calling service is not configured or unavailable.');const {url,token}=await res.json();room=new Room();room.on(RoomEvent.TrackSubscribed,(track)=>{if(track.kind===Track.Kind.Audio){const el=track.attach();document.body.append(el);el.play().catch(()=>{})}});room.on(RoomEvent.Disconnected,reset);await room.connect(url,token);await room.startAudio();await room.localParticipant.setMicrophoneEnabled(true);b.classList.add('active');label.textContent='END CALL';b.disabled=false}catch(e){if(room)await room.disconnect();reset();status.textContent=e.message||'Unable to connect. Please try again.'}};
</script></body></html>
